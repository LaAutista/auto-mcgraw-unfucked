name: Build Release Candidates

# Publishing is deliberate: a rebuilt candidate must not replace a tested XPI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: node --test tests/*.test.mjs

      - name: Package Firefox and experimental Chromium
        run: |
          VERSION=$(jq -er .version manifest.json)
          FIREFOX="auto-mcgraw-firefox-$VERSION-unsigned.xpi"
          CHROMIUM="auto-mcgraw-chrome-brave-$VERSION-experimental.zip"
          zip -r "$FIREFOX" manifest.json LICENSE assets/icon.png assets/settings-icon.svg background content-scripts popup
          mkdir chromium
          unzip -q "$FIREFOX" -d chromium
          jq 'del(.background.scripts, .browser_specific_settings) | .minimum_chrome_version = "121"' manifest.json > chromium/manifest.json
          jq -e '.manifest_version == 3 and .background.service_worker == "background/background.js" and (.background | has("scripts") | not) and (has("browser_specific_settings") | not)' chromium/manifest.json
          (cd chromium && zip -r "../$CHROMIUM" manifest.json LICENSE assets/icon.png assets/settings-icon.svg background content-scripts popup)
          unzip -t "$FIREFOX"
          unzip -t "$CHROMIUM"
          sha256sum "$FIREFOX" "$CHROMIUM" > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: browser-release-candidates
          if-no-files-found: error
          path: |
            auto-mcgraw-firefox-*-unsigned.xpi
            auto-mcgraw-chrome-brave-*-experimental.zip
            SHA256SUMS.txt
