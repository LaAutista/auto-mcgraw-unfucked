name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      has_changed: ${{ steps.version-check.outputs.has_changed }}
      last_tag: ${{ steps.get-latest-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version from manifest
        id: get-version
        run: |
          VERSION=$(jq -r .version manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest tag
        id: get-latest-tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Check if version changed
        id: version-check
        run: |
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$LATEST_TAG" = "none" ] || [ "v$MANIFEST_VERSION" != "$LATEST_TAG" ]; then
            echo "has_changed=true" >> $GITHUB_OUTPUT
          else
            echo "has_changed=false" >> $GITHUB_OUTPUT
          fi

  create-release:
    needs: check-version
    if: needs.check-version.outputs.has_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG="${{ needs.check-version.outputs.last_tag }}"
          if [ "$LATEST_TAG" = "none" ]; then
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges $LATEST_TAG..HEAD)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Test
        run: node tests/regressions.test.mjs

      - name: Create browser packages
        run: |
          zip -r auto-mcgraw-brave-chrome.zip \
            manifest.json \
            LICENSE \
            assets/icon.png \
            assets/settings-icon.svg \
            background \
            content-scripts \
            popup
          cp auto-mcgraw-brave-chrome.zip auto-mcgraw-firefox-unsigned.xpi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release v${{ needs.check-version.outputs.version }}
          body: |
            Download `auto-mcgraw-brave-chrome.zip` for Brave or Chrome.
            The Firefox XPI is unsigned and intended for temporary loading through `about:debugging`; standard Firefox requires Mozilla signing for permanent installation.

            Changes in this release:
            
            ${{ steps.changelog.outputs.CHANGELOG }}
          files: |
            auto-mcgraw-brave-chrome.zip
            auto-mcgraw-firefox-unsigned.xpi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
